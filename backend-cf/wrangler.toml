name = "babylon-report"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Žádný cron: e-mail s reportem odešle aplikace (POST /v1/report) v neděli.

# ── D1 databáze (vytvoření: npx.cmd wrangler d1 create babylon-pokladnice)
[[d1_databases]]
binding = "DB"
database_name = "babylon-pokladnice"
database_id = "DOPLNTE_PO_VYTVORENI"

[vars]
# Veřejná adresa Workeru bez lomítka na konci. Doplníte po prvním nasazení.
PUBLIC_URL = "https://babylon-report.VAS-JMENO.workers.dev"
# Odesílatel: adresa na doméně ověřené v Resend
FROM_EMAIL = "Babylonská pokladnice <report@mail.scmsignpost.com>"
# Adresy, ze kterých smí aplikace volat API (oddělené čárkou). Doplníte podle adresy aplikace.
ALLOWED_ORIGINS = "https://DOPLNTE-ADRESU-APLIKACE"

# Tajný klíč se nastavuje zvlášť, NIKDY ne do tohoto souboru:
#   npx.cmd wrangler secret put RESEND_API_KEY
